[package]
name = "wpbuild"
version = "0.1.0"
edition = "2024"

[features]
concurrent = ["swc_common/concurrent", "dashmap", "rayon", "indexmap/rayon"]
default = ["concurrent"]

[dependencies]
anyhow = "1.0.98"
dashmap = {version="6.1.0", optional=true}
fs_extra = "1.3.0"
indexmap = "2.9.0"
par-core = { workspace = true, features = ["rayon", "parallel"] }
rayon = {version="1.10.0", optional=true}
serde = {version = "1.0.219", features = ["derive"]}
serde_json = "1.0.140"

swc_bundler = "15.0.0"
swc_common = "8.1.1"
swc_core = {version = "22.5.4" }
swc_ecma_ast = "8.1.2"
swc_ecma_codegen = "10.0.1"
swc_ecma_loader = {version="8.0.0", features=["node", "cache"]}
swc_ecma_minifier = {version="16.1.1", features = [
  "concurrent",
]}
swc_ecma_parser = "11.1.4"
swc_ecma_transforms = "15.0.0"
swc_ecma_transforms_base = "12.2.0"
swc_ecma_transforms_optimization = "12.0.1"
swc_ecma_transforms_typescript = "13.0.0"
swc_ecma_visit = "8.0.0"
walkdir = "2.5.0"
